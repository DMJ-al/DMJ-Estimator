<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMJ Estimator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>DMJ Estimator</h1>

    <p>What do you want to estimate?</p>

    <div id="profession-menu">

        <button id="aluminium-btn">Aluminium Works</button>

        <button>Carpentry</button>
        <button>Plumbing</button>
        <button>Electrical</button>
        <button>Painting</button>
        <button>Tiling</button>
        <button>Furniture</button>
        <button>Roofing</button>
        <button>Ironwork</button>
        <button>Engineering</button>

    </div>

    <div id="aluminium-menu" style="display: none;">

        <h2>Aluminium Works</h2>

        <p>What type of aluminium work do you want to estimate?</p>

        <button id="windows-btn">Windows</button>
        <button>Doors</button>
        <button>Roofing</button>
        <button>Partitions</button>
        <button>Shop Fronts</button>
        <button>Stainless Railings</button>
        <button>Other Aluminium Works</button>

    </div>

    <div id="window-menu" style="display: none;">

        <h2>Windows</h2>

        <p>Select window type</p>

        <button id="sliding-window-btn">Sliding Windows</button>
        <button>Casement Windows</button>
        <button>Transom Windows</button>
        <button>Fixed Windows</button>
        <button>Other Types of Windows</button>

    </div>

    <div id="sliding-window-menu" style="display: none;">

        <h2>Sliding Windows</h2>

        <p>Enter the window measurements</p>

        <label for="sliding-width">Width (mm)</label>
        <input type="number" id="sliding-width" placeholder="Enter width">

        <br><br>

        <label for="sliding-height">Height (mm)</label>
        <input type="number" id="sliding-height" placeholder="Enter height">

        <br><br>

        <button>Continue</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
